<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; }
        th { background-color: #f2f2f2; }
        .error { color: red; font-size: 0.9em; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Add New Employee</h2>
    <form th:action="@{/employees}" method="GET" style="margin-bottom: 20px;">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Search by name..." required />
        <button type="submit">Search</button>
        <button type="button" onclick="window.location.href='/employees'">Clear</button>
    </form>
    
    <!-- Employee Registration Form -->
    <form action="#" th:action="@{/employees}" th:object="${employee}" method="POST">
        <div class="form-group">
            <label>Full Name:</label>
            <input type="text" th:field="*{fullName}" />
            <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>
        
        <div class="form-group">
            <label>Email:</label>
            <input type="text" th:field="*{email}" />
            <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        
        <div class="form-group">
            <label>Phone:</label>
            <input type="text" th:field="*{phone}" />
            <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>
        
        <div class="form-group">
            <label>Department:</label>
            <input type="text" th:field="*{department}" />
            <span class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
        </div>
        
        <div class="form-group">
            <label>Salary:</label>
            <input type="text" th:field="*{salary}" />
            <span class="error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
        </div>
        
        <button type="submit">Save Employee</button>
    </form>

    <hr>

    <h2>Employee List</h2>
    
    <!-- Employee Table -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="emp : ${listEmployees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>
                <td>
                    <a th:href="@{/employees/{id}/edit(id=${emp.id})}">Edit</a> |
                    
                    <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="POST" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this employee?');">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
